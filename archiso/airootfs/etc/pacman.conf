#
# /etc/pacman.conf — Nimbus
#
# See the pacman.conf(5) manpage for option and repository directives.

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
Color
ILoveCandy
VerbosePkgLists
ParallelDownloads = 5
DownloadUser = alpm

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Nimbus packages (nimbus-shell). Built by GitHub Actions and published
# on the "repo" release of https://github.com/p1e2r/nimbus-os.
[nimbus]
SigLevel = Optional TrustAll
Server = https://github.com/p1e2r/nimbus-os/releases/download/repo

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

#[multilib]
#Include = /etc/pacman.d/mirrorlist
