#
# /etc/pacman.conf — Nimbus
#
# See the pacman.conf(5) manpage for option and repository directives.

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
Color
ILoveCandy
VerbosePkgLists
ParallelDownloads = 5
DownloadUser = alpm
# Nimbus Desktop already provides the labwc session.
NoExtract   = usr/share/wayland-sessions/labwc.desktop

SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# Nimbus packages and updates (nimbus-shell, nimbus-release, ...).
# Built and signed by GitHub Actions, published on the "repo" release of
# https://github.com/p1e2r/nimbus-os. Signatures are checked against the
# Nimbus key from the nimbus-release package.
[nimbus]
SigLevel = Optional TrustedOnly
Include = /etc/pacman.d/nimbus-mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

#[multilib]
#Include = /etc/pacman.d/mirrorlist
