# The "Desktop" page: pick exactly one desktop to install.
---
mode: required
method: packages
labels:
  step: "Desktop"
  step[id]: "Desktop"
items:
  - id: nimbus
    name: "Nimbus Desktop"
    description: "Nimbus's own desktop. A top panel with a window list, an app launcher on the Super key and a simple settings app. Built in Rust on the lightweight labwc compositor. It is already on this live system, so it installs without internet."
    screenshot: "desktop-nimbus.png"
    packages: []   # already on the live system, so it works offline
  - id: plasma
    name: "KDE Plasma"
    description: "A full-featured, highly customisable desktop with a Windows-like layout. Needs internet to download (about 1.5 GB)."
    screenshot: "desktop-plasma.png"
    packages: [ plasma-meta, konsole, dolphin, kate, ark, spectacle, gwenview, okular, plasma-pa, plasma-nm ]
  - id: gnome
    name: "GNOME"
    description: "A clean, modern desktop with a Mac-like workflow and activity overview. Needs internet to download (about 1.5 GB)."
    screenshot: "desktop-gnome.png"
    packages: [ gnome, gnome-tweaks ]
  - id: hyprland
    name: "Hyprland"
    description: "A tiling Wayland compositor with smooth animations, for people who like to tinker with config files. Needs internet to download."
    screenshot: "desktop-hyprland.png"
    packages: [ hyprland, kitty, waybar, wofi, hyprpaper, hyprlock, hypridle, dunst, xdg-desktop-portal-hyprland ]
  - id: xfce
    name: "Xfce"
    description: "A light, traditional desktop that runs well on older computers. Needs internet to download."
    screenshot: "desktop-xfce.png"
    packages: [ xfce4, xfce4-goodies, network-manager-applet ]
