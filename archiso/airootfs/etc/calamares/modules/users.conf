---
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - lp
  - video
  - network
  - storage
  - name: wheel
    must_exist: false
    system: true
  - audio
sudoersGroup: wheel
sudoersConfigureWithGroup: false
autologinGroup: autologin
setRootPassword: true
doReusePassword: true
doAutologin: false
passwordRequirements:
  minLength: 1
  maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: true
user:
  shell: /bin/bash
  forbidden_names: [ root, live ]
  home_permissions: "o700"
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "${login}-nimbus"
  forbidden_names: [ localhost ]
