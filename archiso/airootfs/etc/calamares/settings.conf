# Nimbus installer (Calamares) configuration.
---
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
  - id: cleanup
    module: shellprocess
    config: shellprocess_cleanup.conf
  - id: finalize
    module: shellprocess
    config: shellprocess_finalize.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - packagechooser
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - shellprocess@cleanup
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - luksbootkeyfile
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - services-systemd
      - packages
      - shellprocess@finalize
      - initcpiocfg
      - initcpio
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

branding: nimbus
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
